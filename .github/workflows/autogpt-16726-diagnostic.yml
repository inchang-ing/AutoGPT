name: AutoGPT 16726 bounded hang diagnosis

on:
  push:
    branches: [codex/ci-autogpt-16726-diagnose-20261116]
    paths: [.github/workflows/autogpt-16726-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: autogpt-16726-diagnose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'inchang-ing/AutoGPT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: original-pr
            sha: ba7417993c987db84301a8c8898d81cfd7057f25
          - mode: test-only
            sha: dbfe17569532353448e9577b2f62d1150ac79ee8
          - mode: final
            sha: 623b2cac752f85ff4e79e7b202a9e969d5291da7
    services:
      clamav:
        image: clamav/clamav-debian:latest
        ports:
          - 3310:3310
        env:
          CLAMAV_NO_FRESHCLAMD: "false"
          CLAMD_CONF_StreamMaxLength: 50M
          CLAMD_CONF_MaxFileSize: 100M
          CLAMD_CONF_MaxScanSize: 100M
          CLAMD_CONF_MaxThreads: 4
          CLAMD_CONF_ReadTimeout: 300
        options: >-
          --health-cmd "clamdscan --version || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 180s

    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/backend
    env:
      TARGET_SHA: ${{ matrix.sha }}
      VALIDATION_MODE: ${{ matrix.mode }}
      CI: "true"
      PLAIN_OUTPUT: "true"
      RUN_ENV: local
      JWT_JWKS_URL: http://localhost:3000/api/auth/jwks

    steps:
      - name: Checkout the reviewed source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify the source and validation mode
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          case "$VALIDATION_MODE" in original-pr|test-only|final) ;; *) exit 1 ;; esac
          printf 'source=%s\nmode=%s\n' "$TARGET_SHA" "$VALIDATION_MODE"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the repository's Poetry version
        run: |
          POETRY_VERSION=$(python ../../.github/workflows/scripts/get_package_version_from_lockfile.py poetry)
          curl --fail --silent --show-error --location https://install.python-poetry.org | POETRY_VERSION="$POETRY_VERSION" python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the locked project and development dependencies
        run: poetry install --no-interaction

      - name: Generate Prisma client and type stub
        uses: ./.github/actions/generate-prisma-client

      - name: Generate only ephemeral test encryption material
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Record the real runtime and source paths
        run: |
          mkdir -p linux-validation
          poetry run python - <<'PY' | tee linux-validation/runtime.log
          import platform
          import sys
          import autogpt_libs
          import backend
          import prisma
          print(platform.platform())
          print(sys.version)
          print(sys.executable)
          for module in (backend, autogpt_libs, prisma):
              print(module.__name__, module.__file__)
          PY
          poetry show --no-ansi > linux-validation/dependencies.txt

      - name: Wait for the real ClamAV daemon
        shell: bash
        env:
          CLAMAV_CONTAINER: ${{ job.services.clamav.id }}
        run: |
          test -n "$CLAMAV_CONTAINER"
          clamav_ready=false
          for _ in $(seq 1 60); do
            if nc -z localhost 3310; then
              clamav_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$clamav_ready" != "true" ]]; then
            docker logs "$CLAMAV_CONTAINER" >&2
            echo "ClamAV failed to start" >&2
            exit 1
          fi
          if ! timeout 10 bash -c 'echo "PING" | nc localhost 3310'; then
            docker logs "$CLAMAV_CONTAINER" >&2
            echo "ClamAV is not responding to PING" >&2
            exit 1
          fi

      # Mandatory architecture and block harness already ran on the exact final SHA.
      # This independent diagnostic leaves that run and its results intact.
      - name: Diagnose all six complete files without changing their test policy
        run: |
          set -uo pipefail
          mkdir -p linux-validation
          set +e
          timeout --signal=INT --kill-after=15s 240s \
            poetry run pytest -vv --tb=short -o faulthandler_timeout=60 \
            backend/blocks/time_blocks_test.py \
            backend/api/external/v1/routes_test.py \
            backend/api/features/blocks/routes_test.py \
            backend/api/features/graph_executions/review/resume_reads_test.py \
            backend/executor/run_start_reads_test.py \
            backend/copilot/tools/helpers_test.py \
            --cov=backend \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:linux-validation/full-six-coverage.json \
            --cov-report=xml:linux-validation/full-six-coverage.xml \
            --junitxml=linux-validation/full-six.xml \
            2>&1 | tee linux-validation/full-six.log
          command_status=("${PIPESTATUS[@]}")
          printf 'command_exit=%s\ntee_exit=%s\n' "${command_status[0]}" "${command_status[1]}" > linux-validation/full-six-exit-codes.txt
          if (( command_status[0] != 0 )); then
            exit "${command_status[0]}"
          fi
          exit "${command_status[1]}"

      - name: Final only - original 17 cases and complete time block suite
        if: ${{ always() && matrix.mode == 'final' }}
        run: |
          set -uo pipefail
          mkdir -p linux-validation
          set +e
          timeout --signal=INT --kill-after=15s 150s \
            poetry run pytest -vv --tb=short -o faulthandler_timeout=60 \
            'backend/api/external/v1/routes_test.py::test_execute_time_block_uses_the_profile_or_configured_timezone[not-set-True-+0900]' \
            'backend/api/external/v1/routes_test.py::test_execute_time_block_uses_the_profile_or_configured_timezone[UTC-True-+0000]' \
            'backend/api/external/v1/routes_test.py::test_execute_time_block_uses_the_profile_or_configured_timezone[Invalid/Timezone-True-+0000]' \
            'backend/api/external/v1/routes_test.py::test_execute_time_block_uses_the_profile_or_configured_timezone[None-True-+0000]' \
            'backend/api/external/v1/routes_test.py::test_execute_time_block_uses_the_profile_or_configured_timezone[UTC-False-+0900]' \
            'backend/api/features/blocks/routes_test.py::test_execute_graph_block_forwards_execution_context[America/New_York]' \
            'backend/api/features/blocks/routes_test.py::test_execute_graph_block_forwards_execution_context[not-set]' \
            'backend/api/features/graph_executions/review/resume_reads_test.py::test_a_resumed_run_reads_its_user_and_settings_side_by_side_then_its_workspace[Europe/Paris]' \
            'backend/api/features/graph_executions/review/resume_reads_test.py::test_a_resumed_run_reads_its_user_and_settings_side_by_side_then_its_workspace[not-set]' \
            'backend/executor/run_start_reads_test.py::test_a_new_run_reads_its_user_and_settings_side_by_side_then_its_workspace[Europe/Paris]' \
            'backend/executor/run_start_reads_test.py::test_a_new_run_reads_its_user_and_settings_side_by_side_then_its_workspace[not-set]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[not-set-True-+0900]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[Asia/Kolkata-True-+0530]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[UTC-True-+0000]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[Invalid/Timezone-True-+0000]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[None-True-+0000]' \
            'backend/copilot/tools/helpers_test.py::test_execute_time_block_uses_profile_or_configured_timezone[UTC-False-+0900]' \
            backend/blocks/time_blocks_test.py \
            --cov=backend \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:linux-validation/focused-timezone-coverage.json \
            --cov-report=xml:linux-validation/focused-timezone-coverage.xml \
            --junitxml=linux-validation/focused-timezone.xml \
            2>&1 | tee linux-validation/focused-timezone.log
          command_status=("${PIPESTATUS[@]}")
          printf 'command_exit=%s\ntee_exit=%s\n' "${command_status[0]}" "${command_status[1]}" > linux-validation/focused-timezone-exit-codes.txt
          if (( command_status[0] != 0 )); then
            exit "${command_status[0]}"
          fi
          exit "${command_status[1]}"

      - name: Preserve raw reports without changing test outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autogpt-16726-diagnose-${{ matrix.mode }}-${{ matrix.sha }}
          path: autogpt_platform/backend/linux-validation/
          if-no-files-found: error
          retention-days: 7
